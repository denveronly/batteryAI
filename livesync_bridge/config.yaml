name: Obsidian LiveSync Bridge
version: "0.2.0"
slug: livesync_bridge
description: Obsidian notes from a Self-hosted LiveSync vault (CouchDB) in the Home Assistant sidebar, read and written straight in the database
url: https://github.com/denveronly/batteryai/tree/main/livesync_bridge
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-outline
panel_title: Obsidian
panel_admin: true
map:
  - share:rw
options:
  couchdb_url: "http://192.168.1.2:5984"
  database: obsidian
  username: obsidian_user
  password: ""
  passphrase: ""
  path_obfuscation: false
  voice_note_folder: Claude Note
  timezone: Europe/Kyiv
  mirror_to_share: false
  share_folder: obsidian
  vault_subfolder: ""
  unicode_nfc_paths: false
  filename_case_sensitive: false
  reset_on_start: false
schema:
  couchdb_url: url
  database: str
  username: str
  password: password
  passphrase: password?
  path_obfuscation: bool
  voice_note_folder: str
  timezone: str
  mirror_to_share: bool
  share_folder: match(^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$)
  vault_subfolder: str?
  unicode_nfc_paths: bool
  filename_case_sensitive: bool
  reset_on_start: bool
