name: BatteryAI
version: "0.4.5"
slug: batteryai
description: Records battery, solar and load data and uses Claude to plan Deye battery SOC
url: https://github.com/denveronly/batteryai
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging-high
panel_title: BatteryAI
# The local LLM model (~2 GB, re-downloadable) is kept out of Home Assistant backups.
backup_exclude:
  - "models/*"
  - "*.gguf"
  - "*.part"
# All settings are edited in the BatteryAI panel (Settings tab) and stored in
# /data/settings.json. Options from version 0.1.0 are imported on first start.
options: {}
schema: {}
